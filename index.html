<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3f8344" />
    <meta name="description" content="VolunTrack is a calm volunteer hour tracker. Log hours, set goals, earn badges, and generate reports for school or community service." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VolunTrack" />
    <title>VolunTrack · Volunteer Hour Tracker</title>

    <!-- Canonical/OG/Twitter URLs are filled in at build time from VITE_SITE_URL
         via Vite's built-in %ENV_VAR% HTML replacement (see vite.config.js,
         which guarantees this is never blank — falls back to localhost when
         unset). Set the real domain as a Netlify dashboard env var. -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VolunTrack" />
    <meta property="og:title" content="VolunTrack · Volunteer Hour Tracker" />
    <meta property="og:description" content="VolunTrack is a calm volunteer hour tracker. Log hours, set goals, earn badges, and generate reports for school or community service." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VolunTrack · Volunteer Hour Tracker" />
    <meta name="twitter:description" content="VolunTrack is a calm volunteer hour tracker. Log hours, set goals, earn badges, and generate reports for school or community service." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/logo.png" />

    <script type="application/ld+json" id="ld-software-app">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "VolunTrack",
        "url": "%VITE_SITE_URL%/",
        "applicationCategory": "LifestyleApplication",
        "applicationSubCategory": "Volunteer hour tracker",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "description": "VolunTrack is a calm volunteer hour tracker. Log hours, set goals, earn badges, and generate reports for school or community service.",
        "featureList": [
          "Log volunteer hours with activity, category, location, and notes",
          "Supervisor verification by one-time email link (no account needed)",
          "Goals with dashboard progress tracking",
          "Automatic achievement badges",
          "PDF reports, CSV export, and printable service certificates",
          "School and multi-school organization dashboards",
          "Parent accounts linked to a student's hours",
          "Cross-device sync, two-factor authentication, offline PWA"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "publisher": { "@id": "%VITE_SITE_URL%/#organization" }
      }
    </script>

    <script type="application/ld+json" id="ld-organization">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "%VITE_SITE_URL%/#organization",
        "name": "VolunTrack",
        "url": "%VITE_SITE_URL%/",
        "logo": "%VITE_SITE_URL%/logo.png",
        "description": "VolunTrack is a free volunteer hour tracker for students, parents, schools, and organizations — log hours, get supervisor verification, and export reports for school and community-service requirements.",
        "sameAs": [
          "https://www.instagram.com/volunteertrackofficial/",
          "https://github.com/Hriday21223/VolunTrack"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "volunteertrackinfo@gmail.com",
          "url": "%VITE_SITE_URL%/contact"
        }
      }
    </script>

    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plus-jakarta-sans-latin.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
