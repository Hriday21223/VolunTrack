# Render blueprint: one Node web service using external Neon database.
# Deploy by connecting this repo in the Render dashboard (New > Blueprint).
# After the first deploy, set ADMIN_EMAIL and ADMIN_PASSWORD in the Environment tab.
#
# ⚠️  Sensitive env vars (DATABASE_URL, EMAIL_USER, EMAIL_PASSWORD) are NOT
#     stored in this file. Set them in the Render dashboard under
#     Dashboard → your-service → Environment to keep them out of version control.
#
# Also set FRONTEND_URL there to your deployed Netlify site URL (e.g.
# https://your-site.netlify.app) once it's known, so CORS allows it.
services:
  - type: web
    name: voluntrack-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_FROM
        value: volunteertrack@googlegroups.com
      # Cloudflare Turnstile secret for bot protection on public forms.
      # Optional — set it in the dashboard (paired with VITE_TURNSTILE_SITE_KEY
      # on the frontend host) to enable the checks; leave unset to disable.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # This service's own public origin — used to build the unsubscribe link
      # in the parent weekly digest emails (server/digest.js).
      - key: PUBLIC_BACKEND_URL
        value: https://voluntrack-backend-frrh.onrender.com
      # Shared secret for the parent-digest cron endpoint (x-cron-key header).
      # Set it in the dashboard and add a matching GitHub Actions repo secret
      # named CRON_SECRET; leave unset to disable the endpoint.
      - key: CRON_SECRET
        sync: false
