name: Monthly progress email

# On the 1st of each month, a "nice work" email to every student who logged
# hours the month before: what they logged, their total, and how close they
# are to their goal (#483). Same shape as comeback-nudges.yml: Render's free
# tier has no cron, so the schedule lives here and the work happens on the
# backend (server/monthlyProgress.js). The only secret here is CRON_SECRET.
#
# Setup: repo secret CRON_SECRET (matching the backend's env var) and repo
# variable PUBLIC_BACKEND_URL — the same ones comeback-nudges.yml uses.
#
# Idempotency is the backend's: monthly_progress_sends (user_id, month) is
# claimed before sending, so a duplicate run emails nobody twice. The
# response carries counts and student ids only — never names or addresses.

on:
  schedule:
    # The 1st at 15:30 UTC (~11:30 US Eastern): last month is over everywhere.
    - cron: '30 15 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Count who would get it on the backend instead of emailing them
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the monthly progress endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || false }}
        run: |
          set -uo pipefail
          # Retry only when no HTTP response came back at all (a Render cold
          # start). Any actual status is final: 503 means the backend is
          # unconfigured, which retrying cannot fix, and a 2xx is done.
          url="$BACKEND_URL/api/progress/internal/run"
          body="$(mktemp)"
          attempt=1
          while :; do
            code=$(curl -sS -X POST \
              --connect-timeout 30 --max-time 900 \
              -o "$body" -w '%{http_code}' \
              -H "x-cron-key: $CRON_SECRET" \
              -H 'content-type: application/json' \
              -d "{\"dryRun\": $DRY_RUN }" \
              "$url") || code=000
            echo "HTTP $code"
            cat "$body"; echo
            case "$code" in
              2??)
                # A run with nobody to email is a legitimate success, but a
                # backend that cannot send email is not — the bell entries
                # would land while every email silently went nowhere.
                if grep -q '"emailConfigured":false' "$body"; then
                  echo "::error::backend reached, but no email provider is configured — no progress email was sent."
                  exit 1
                fi
                exit 0
                ;;
              503)
                echo "::error::backend returned 503 (unconfigured CRON_SECRET or database) — retrying will not help."
                exit 1
                ;;
              000)
                : # no HTTP response: likely a cold start, worth a retry
                ;;
              *)
                echo "::error::unexpected HTTP $code from the monthly progress endpoint."
                exit 1
                ;;
            esac
            if [ "$attempt" -ge 3 ]; then
              echo "::error::backend unreachable after $attempt attempts."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 30
          done
