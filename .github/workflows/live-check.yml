name: Live check

# The live-site test robot (#315): scripts/live-check.mjs loads the deployed
# site in headless Chrome, checks the backend, pages, CAPTCHA, map/form
# security policy and security headers, and reports to the backend
# (POST /api/status/live-checks), which emails the admin when a check fails
# twice in a row and shows every run in Admin → Incidents.
#
# The run is only red when the report couldn't be delivered: failing checks
# are the backend's to announce, and a red run would also set off the
# CI-failure routines (#58) for what is a site problem, not a CI one.
#
# Setup: repo secret CRON_SECRET (already used by the reminder workflows).
# Optional (#318): MONITOR_EMAIL / MONITOR_PASSWORD / MONITOR_SECRET — the same
# three values as on Render — let it sign in and test the signed-in pages;
# OPENROUTER_API_KEY (free models) or ANTHROPIC_API_KEY adds an AI-written
# summary to a failing run's alert. Repo variable LIVE_CHECK_MODEL overrides
# the model (default openrouter/free, or claude-haiku-5-5 for Anthropic).

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      test_summary:
        description: Only test the AI summary on a made-up failure (runs no checks, reports and emails nothing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Recent commits give the AI summary something to point at.
          fetch-depth: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome
      - name: Test the live site and report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MONITOR_EMAIL: ${{ secrets.MONITOR_EMAIL }}
          MONITOR_PASSWORD: ${{ secrets.MONITOR_PASSWORD }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIVE_CHECK_MODEL: ${{ vars.LIVE_CHECK_MODEL }}
          LIVE_CHECK_TEST_SUMMARY: ${{ inputs.test_summary }}
        run: node scripts/live-check.mjs
