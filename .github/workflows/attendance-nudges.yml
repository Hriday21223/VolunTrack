name: After-event attendance nudges

# The day after a volunteer task, asks its organizer once to mark who came
# (if any approved volunteer still has no hours logged for it); 3 days after,
# tells each volunteer still without hours once that they can log them (#474).
# Same shape as task-reminders.yml: the schedule lives here because Render's
# free tier has no cron, and the backend does the work.
#
# Setup: repo secret CRON_SECRET (matching the backend's env var) and repo
# variable PUBLIC_BACKEND_URL — the same ones task-reminders.yml uses.
#
# Idempotency is the backend's: public_task_attendance_nudges stamps each
# task's organizer and volunteer sends, so a duplicate run mails nobody twice.

on:
  schedule:
    # ~15:00 UTC (~10:00 US Eastern): late enough that "yesterday" is over in
    # every US time zone, early enough to act on the same day.
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Count the recipients on the backend instead of mailing them
        type: boolean
        default: false

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the attendance nudge endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || false }}
        run: |
          set -uo pipefail
          # Retry only when no HTTP response came back at all (a Render cold
          # start). Any actual status is final: 503 means the backend is
          # unconfigured, which retrying cannot fix, and a 2xx is done.
          url="$BACKEND_URL/api/school/public-tasks/internal/run-attendance-nudges"
          body="$(mktemp)"
          attempt=1
          while :; do
            code=$(curl -sS -X POST \
              --connect-timeout 30 --max-time 900 \
              -o "$body" -w '%{http_code}' \
              -H "x-cron-key: $CRON_SECRET" \
              -H 'content-type: application/json' \
              -d "{\"dryRun\": $DRY_RUN }" \
              "$url") || code=000
            echo "HTTP $code"
            cat "$body"; echo
            case "$code" in
              2??)
                # A run with nothing scheduled is a legitimate success, but a
                # backend that cannot send email is not — it would report the
                # same ok:true while every nudge silently went nowhere.
                if grep -q '"emailConfigured":false' "$body"; then
                  echo "::error::backend reached, but no email provider is configured — no nudge was sent."
                  exit 1
                fi
                exit 0
                ;;
              503)
                echo "::error::backend returned 503 (unconfigured CRON_SECRET or database) — retrying will not help."
                exit 1
                ;;
              000)
                : # no HTTP response: likely a cold start, worth a retry
                ;;
              *)
                echo "::error::unexpected HTTP $code from the attendance nudge endpoint."
                exit 1
                ;;
            esac
            if [ "$attempt" -ge 3 ]; then
              echo "::error::backend unreachable after $attempt attempts."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 30
          done
