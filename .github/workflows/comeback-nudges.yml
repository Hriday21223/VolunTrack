name: Comeback nudges

# Once a week, a friendly "we miss you" bell notification + email (with up to
# three open volunteer tasks) to students who haven't logged hours in a month.
# Same shape as parent-weekly-digest.yml and task-reminders.yml: Render's free
# tier has no cron, so the schedule lives here and the work happens on the
# backend (server/comeback.js), which already holds DATABASE_URL and the email
# credentials. The only secret here is the opaque CRON_SECRET.
#
# Setup: repo secret CRON_SECRET (matching the backend's env var) and repo
# variable PUBLIC_BACKEND_URL.
#
# Idempotency is the backend's: users.comeback_nudged_at is claimed per
# student before sending, so a duplicate run nudges nobody twice. The response
# carries student ids and task counts only — never names or addresses.

on:
  schedule:
    # Wednesdays 16:00 UTC (~noon US Eastern) — mid-week, before weekend plans.
    - cron: '0 16 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List who would be nudged on the backend instead of nudging them
        type: boolean
        default: false

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the comeback nudge endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || false }}
        run: |
          set -uo pipefail
          # Retry only when no HTTP response came back at all (a Render cold
          # start). Any actual status is final: 503 means the backend is
          # unconfigured, which retrying cannot fix, and a 2xx is done.
          url="$BACKEND_URL/api/comeback/internal/run"
          body="$(mktemp)"
          attempt=1
          while :; do
            code=$(curl -sS -X POST \
              --connect-timeout 30 --max-time 900 \
              -o "$body" -w '%{http_code}' \
              -H "x-cron-key: $CRON_SECRET" \
              -H 'content-type: application/json' \
              -d "{\"dryRun\": $DRY_RUN }" \
              "$url") || code=000
            echo "HTTP $code"
            cat "$body"; echo
            case "$code" in
              2??)
                # A run with nobody to nudge is a legitimate success, but a
                # backend that cannot send email is not — the bell entries
                # would land while every email silently went nowhere.
                if grep -q '"emailConfigured":false' "$body"; then
                  echo "::error::backend reached, but no email provider is configured — no nudge email was sent."
                  exit 1
                fi
                exit 0
                ;;
              503)
                echo "::error::backend returned 503 (unconfigured CRON_SECRET or database) — retrying will not help."
                exit 1
                ;;
              000)
                : # no HTTP response: likely a cold start, worth a retry
                ;;
              *)
                echo "::error::unexpected HTTP $code from the comeback nudge endpoint."
                exit 1
                ;;
            esac
            if [ "$attempt" -ge 3 ]; then
              echo "::error::backend unreachable after $attempt attempts."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 30
          done
