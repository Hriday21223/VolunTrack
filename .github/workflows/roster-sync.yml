name: Roster sync

# Nightly: re-read every class a school imported from Google Classroom or
# Clever (#608) and invite anyone new; students who left are reported to the
# adviser on their next sync, never removed. The work happens on the backend
# (server/rosterSync.js); the only secret here is CRON_SECRET.

on:
  schedule:
    # Daily 09:15 UTC (4:15 AM US Central).
    - cron: '15 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Count the classes due instead of syncing them
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the roster sync endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || false }}
        run: |
          set -uo pipefail
          # Retry only when no HTTP response came back at all (a Render cold
          # start). Any actual status is final: 503 means the backend is
          # unconfigured, which retrying cannot fix, and a 2xx is done.
          url="$BACKEND_URL/api/roster-sync/internal/run"
          body="$(mktemp)"
          attempt=1
          while :; do
            code=$(curl -sS -X POST \
              --connect-timeout 30 --max-time 900 \
              -o "$body" -w '%{http_code}' \
              -H "x-cron-key: $CRON_SECRET" \
              -H 'content-type: application/json' \
              -d "{\"dryRun\": $DRY_RUN }" \
              "$url") || code=000
            echo "HTTP $code"
            cat "$body"; echo
            case "$code" in
              2??)
                exit 0
                ;;
              503)
                echo "::error::backend returned 503 (unconfigured CRON_SECRET or database) — retrying will not help."
                exit 1
                ;;
              000)
                : # no HTTP response: likely a cold start, worth a retry
                ;;
              *)
                echo "::error::unexpected HTTP $code from the roster sync endpoint."
                exit 1
                ;;
            esac
            if [ "$attempt" -ge 3 ]; then
              echo "::error::backend unreachable after $attempt attempts."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 30
          done
