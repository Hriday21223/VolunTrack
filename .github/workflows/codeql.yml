name: "CodeQL"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'android/**'
      - 'ios/**'
      - 'dist/**'
      - 'node_modules/**'
      - 'output/**'
      - 'outputs/**'
      - '_site/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'android/**'
      - 'ios/**'
      - 'dist/**'
      - 'node_modules/**'
      - 'output/**'
      - 'outputs/**'
      - '_site/**'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
